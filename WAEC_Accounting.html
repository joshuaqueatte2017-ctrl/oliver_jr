.dashboard .card strong{font-size:clamp(18px,1.6vw,24px);margin-top:5px;line-height:1.25}
@media(max-width:480px){.dashboard .grid{grid-template-columns:1fr}}

/* Keep the authenticated workspace aligned to the top of its grid row. */
@media screen {
 body:has(nav:not([hidden])) main{align-self:start;margin:0;padding:12px 24px 24px;grid-column:2;grid-row:2}
 body:has(nav:not([hidden])) nav{grid-column:1;grid-row:2;align-self:start}
 .dashboard h2{margin-top:0;margin-bottom:10px}
 @media(max-width:700px){body:has(nav:not([hidden])) main{padding:10px 12px 20px}}
}

/* Dedicated WAEC authentication layout; does not affect the ledger workspace. */
@media screen {
body.auth-screen{min-height:100vh;background:radial-gradient(ellipse at 15% 10%,#246b82 0,transparent 48%),linear-gradient(135deg,#09233e,#123d59 65%,#17605f);}
body.auth-screen header{display:none}
body.auth-screen main{min-height:100vh;max-width:560px;margin:auto;padding:28px 18px;display:flex;flex-direction:column;justify-content:center}
body.auth-screen .auth{width:100%;max-width:none;margin:0;background:#fff;border-radius:18px;padding:32px 38px;border-top:5px solid #d7aa49;box-shadow:0 24px 70px #06192b66;}
.auth-brand{text-align:center;margin-bottom:12px}.auth-brand img{display:block;width:90px;height:90px;object-fit:contain;margin:0 auto 2px}.auth-brand h1{font-size:clamp(21px,4vw,27px);line-height:1.15;color:#102f46;margin:0 0 3px}.auth-brand p{margin:0;color:#526b7a;font-size:14px}.auth-brand .auth-unit{color:#17605f;font-size:12px;font-weight:700;letter-spacing:1.7px;text-transform:uppercase;margin-top:4px}
body.auth-screen .auth h2{font-size:21px;margin:0 0 16px;color:#102f46;border-top:1px solid #e0e8ed;padding-top:12px}body.auth-screen .auth label{font-size:14px;margin-bottom:15px}body.auth-screen .auth input:not([type=checkbox]),body.auth-screen .auth select{padding:12px;margin-top:5px;border-color:#c1d0db;border-radius:8px}body.auth-screen .auth form>button{width:100%;padding:12px;background:#123d59;font-weight:700;border-radius:8px}body.auth-screen .auth button[data-action="reset-toggle"]{display:block;margin:12px auto 0;background:transparent;color:#17605f;font-weight:600} .auth-footer{text-align:center;font-size:12px;color:#526b7a;margin:22px 0 0}body.auth-screen #message{margin-bottom:12px}
@media(max-width:480px){body.auth-screen .auth{padding:24px 20px}}
}

/* Compact authentication layout only */
body.auth-screen main{max-width:480px;padding:16px 14px}
body.auth-screen .auth{padding:22px 28px;border-radius:15px}
body.auth-screen .auth-brand{margin-bottom:9px}
body.auth-screen .auth-brand img{width:76px;height:76px}
body.auth-screen .auth-brand h1{font-size:clamp(19px,4vw,23px)}
body.auth-screen .auth h2{font-size:19px;margin-bottom:11px;padding-top:9px}
body.auth-screen .auth label{margin-bottom:10px}
body.auth-screen .auth input:not([type=checkbox]),body.auth-screen .auth select{padding:9px;margin-top:4px}
body.auth-screen .auth form>button{padding:10px}
body.auth-screen .auth button[data-action="reset-toggle"]{margin-top:8px}
body.auth-screen .auth-footer{margin-top:13px}
@media(max-width:480px){body.auth-screen .auth{padding:18px 16px}}

/* Consistent destructive-action styling across all modules */
button[data-action$="-delete"],button[data-action$="-delete-all"],form[id$="-delete"]>button,form[id$="-delete-all"]>button,#audit-reset>button{background:#b91c1c!important;color:#fff!important;border:1px solid #991b1b!important;font-weight:700}
button[data-action$="-delete"]:hover,button[data-action$="-delete-all"]:hover,form[id$="-delete"]>button:hover,form[id$="-delete-all"]>button:hover,#audit-reset>button:hover{background:#991b1b!important}
fieldset:has(>form[id$="-delete"]),fieldset:has(>form[id$="-delete-all"]),fieldset:has(>#audit-reset){background:#fff1f2;border:2px solid #b91c1c!important;color:#881337;border-radius:8px;padding:12px}
fieldset:has(>form[id$="-delete"]) legend,fieldset:has(>form[id$="-delete-all"]) legend,fieldset:has(>#audit-reset) legend{color:#b91c1c;font-weight:700}
fieldset:has(>form[id$="-delete"]) input,fieldset:has(>form[id$="-delete-all"]) input,fieldset:has(>#audit-reset) input{border-color:#b91c1c}
</style>
<style>
dialog.delete-alert{border:2px solid #b91c1c;border-top:8px solid #b91c1c;border-radius:12px;background:#fff1f2;color:#881337;padding:24px;width:min(440px,90vw);box-sizing:border-box;box-shadow:0 16px 60px #0005}dialog.delete-alert::backdrop{background:#0008}dialog.delete-alert h3{color:#b91c1c;margin:0 0 12px}dialog.delete-alert p{color:#991b1b;overflow-wrap:anywhere}dialog.delete-alert form{display:block}dialog.delete-alert button[value="authorize"],dialog.delete-alert button[value="delete"]{background:#b91c1c!important;color:white!important;border:1px solid #991b1b!important}dialog.delete-alert button[value="cancel"]{background:white!important;color:#334155!important;border:1px solid #94a3b8!important}
</style>

function write(next) {
  return new Promise((resolve,reject) => {
    const tx = db.transaction('ledger','readwrite');
    const store = tx.objectStore('ledger');
    const request = store.get('state');
    let conflict = false;
    request.onsuccess = () => {
      if (request.result?.revision !== state?.revision) {
        conflict = true;
        tx.abort();
        return;
      }
      next.revision = (state?.revision ?? 0)+1;
      store.put(next,'state');
    };
    tx.oncomplete = () => { state = next; resolve(); };
    tx.onabort = () => reject(new Error(conflict?'The ledger changed in another tab. Reload this page before trying again.':(tx.error?.message || 'The ledger could not be saved.')));

}

  if (kind==='Revenue') {

      const school = lookupSchool(data.get('school'));
      need(school,'Enter a valid registered school code.');
      e.school = school.code;
      e.payer = school.name;
    } else e.payer = field(data,'payer',150);
  }
  if (kind==='Journal') {
    for (let i=0;i<8;i++) {
      const code = data.get('code'+i), debit = data.get('debit'+i).trim(), credit = data.get('credit'+i).trim();
      if (!code && !debit && !credit) continue;

  const cash = e.lines.filter(l=>account(l.code).cash);
  if (cash.length===e.lines.length) e.flow = 'Transfer';

    ['Statement of income and expenditure',['Account / item','Amount'],[...entries(revenue,during,-1),['Total revenue',income],...entries(expenses,during),['Total expenditure',expense],['Surplus / (deficit)',surplus]]],
    ['Statement of financial position',['Account / item','Amount'],[...entries(assets,ending),['Total assets',totalAssets],...entries(liabilities,ending,-1),['Total liabilities',totalLiabilities],...entries(equity,ending,-1),['Prior accumulated surplus / (deficit)',prior],['Period surplus / (deficit)',surplus],['Total funds',closingFunds],['Total liabilities and funds',add(totalLiabilities,closingFunds)],['Balance check',sum([totalAssets,-totalLiabilities,-closingFunds])]]],
    ['Statement of cash flows',['Cash movement','Amount'],[['Opening cash and bank',openCash],...flows.flatMap(f=>[[f+' receipts',movement[f][0]],[f+' payments',movement[f][1]],['Net '+f.toLowerCase(),sum(movement[f])]]),['Net change in cash',netCash],['Closing cash and bank',closeCash],['Cash reconciliation difference',sum([closeCash,-openCash,-netCash])]]],
    ['Statement of changes in funds',['Movement','Amount'],[['Opening funds',openingFunds],['Period surplus / (deficit)',surplus],['Direct movements in funds',direct],['Closing funds',closingFunds]]],
    ['Trial balance',['Account','Debit','Credit'],[...trial,['Totals',debit,credit],['Debit less credit',add(debit,-credit),'']]]
  ];
}
function reportView() {
  return section('Financial statements',form('range','<div class="grid">'+dateInput('Start date','start',range.start)+dateInput('End date','end',range.end)+'</div>','Generate')+
    '<div class="actions">'+button('Print / Save statements as PDF','print')+'</div>','no-print')+
    `<p>${html(range.start)} to ${html(range.end)} · ${state.currency} · Posted vouchers</p>`+
    reports(range.start,range.end).map(([title,headers,rows],i)=>section(title,table(headers,rows.map(row=>row.map(x=>typeof x==='number'?amount(x):x)))+
      '<div class="actions">'+button('Export CSV','csv',i)+'</div>')).join('');
}
function download(name,body,type) {
  const url = URL.createObjectURL(new Blob([body],{type}));
  const a = document.createElement('a');
  a.href=url;
  a.download=name;
  a.click();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
}
function csv(index) {
  const [title,headers,rows] = reports(range.start,range.end)[index];
  const encode = x => {
    const value = typeof x==='number' ? amount(x).replaceAll(',','') : (/^[=+@\-\t\r\n]/.test(x)?"'"+x:x);
    return '"'+value.replaceAll('"','""')+'"';
  };
  download(title.toLowerCase().replaceAll(' ','-')+'.csv','\ufeff'+[[title,state.currency],[range.start,range.end],headers,...rows].map(row=>row.map(encode).join(',')).join('\r\n'),'text/csv;charset=utf-8');
}

let editAccount = '';
function accountsView() {
  const a=account(editAccount), used=a&&state.entries.some(e=>e.lines.some(l=>l.code===a.code));
  return section('Chart of accounts',form('account','<div class="grid">'+input('Account code','code',`required maxlength="12" value="${html(a?.code??'')}" ${used?'readonly':''}`)+input('Account name','name',`required maxlength="100" value="${html(a?.name??'')}"`)+`<label>Type<select name="type" required ${used?'disabled':''}>${types.map(t=>`<option ${a?.type===t?'selected':''}>${t}</option>`).join('')}</select></label></div><label><input type="checkbox" name="cash" ${a?.cash?'checked':''} ${used?'disabled':''}> Cash or bank account</label>`+(used?'<p>Account is linked to vouchers: only its name can be changed.</p>':''),a?'Save changes':'Add account')+(a?button('Cancel edit','account-edit'):'')+
    button('Export Chart of Accounts','accounts-export')+
    table(['Code','Name','Type','Cash / bank','Action'],state.accounts.map(a=>[a.code,a.name,a.type,a.cash?'Yes':'',button('Edit','account-edit',a.code)+(can('admin')?' '+button('Delete','account-delete',a.code):'')]),[4]));
}
let editSchool = '';
const schoolTypes=['Public','Private','Mission','Community'];
function schoolRecord(code,name,address,type) {
  code=String(code??'').trim().toUpperCase(); name=String(name??'').trim(); address=String(address??'').trim();
  need(/^[A-Z0-9][A-Z0-9._-]{0,23}$/.test(code)&&name.length>0&&name.length<=150&&address.length>0&&address.length<=240,'Invalid school code, name or address.');
  type=schoolTypes.find(t=>t.toLowerCase()===String(type??'').trim().toLowerCase());
  need(type,'Choose a valid school type.');
  return {code,name,address,type};
}
async function schoolCSV(file) {
  need(file && file.size>0 && file.size<=5000000,'Choose a CSV file up to 5 MB.');
  const text=(await file.text()).replace(/^\uFEFF/,'');
  let rows=[],row=[],cell='',quoted=false,ended=false;
  for(let i=0;i<text.length;i++){

$('view').addEventListener('submit',event=>{
  event.preventDefault();
  const data=new FormData(event.target);
  if(event.target.id==='review' && event.submitter) data.set('decision',event.submitter.value);
  if(['school-delete-all','audit-reset','voucher-delete'].includes(event.target.id)) event.target.elements.password.value='';
  perform(async()=>{
    if(['entry','filter'].includes(event.target.id)) {
      state=await read();
      need(current() && !current().mustChange,'Sign in again.');
    }
    return submit(event.target.id,data);
  });
});
$('view').addEventListener('input',event=>{
  if(event.target.name==='school') updateSchoolName(event.target.form);
  if(event.target.id==='school-search' && can('schools')){schoolSearch=event.target.value;schoolPage=1;$('school-results').innerHTML=schoolResults();}
});
$('view').addEventListener('click',event=>{
  const refresh=event.target.closest('[data-refresh-schools]');
  if(refresh){perform(async()=>{
    need(['revenue','queue','ledger'].includes(page),'Open a school transaction module.');
    state=await read(); requirePage();
    need(current() && !current().mustChange,'Sign in again.');
    updateSchoolName(refresh.closest('form'));
    notice('School register refreshed.'); return null;
  });return;}
  const b=event.target.closest('[data-school-page]');
  if(!b||b.disabled||!can('schools'))return;
  const action=b.dataset.schoolPage;
  schoolPage=action==='first'?1:action==='last'?Number.MAX_SAFE_INTEGER:schoolPage+(action==='next'?1:-1);
  $('school-results').innerHTML=schoolResults();
});
$('view').addEventListener('change' ,event=>{if(event.target.id==='show-auth-password'){event.target.closest('form').querySelectorAll('input[name=password],input[name=recovery],input[name=confirm]').forEach(x=>x.type=event.target.checked?'text':'password');}if (event.target.name==='party') partyFields();});
document.addEventListener('click',event=>{
  const control = event.target.closest('[data-action]');
  if (!control) return;
  const {action,value} = control.dataset;
  perform(async()=>{
    if(action==='reset-toggle'){need(!current(),'Sign out first.');resetMode=!resetMode;return '';}
    if (action==='logout') {
      editAccount='';actor=undefined;schoolSearch='';schoolPage=1;page='home';voucher=undefined;schoolFilter='';editUser='';
      state=await read();
      return '';
    }
    requirePage();
    if (action==='page') {
      const target = buttons.find(([id])=>id===value);
      need(target,'Unknown module.');
      state=await read();
      need(current() && !current().mustChange,'Sign in again.');
      requireRight(target[2]);
      page=value; editAccount=''; schoolSearch=''; schoolPage=1; editSchool=''; voucher=undefined; schoolFilter=''; editUser='';
    } else if (action==='voucher') {
      need(['ledger','queue'].includes(page),'Open the ledger or approval queue first.');
      voucher=Number(value);
    } else if (action==='school-template') {
      requireRight('schools');download('Schools_Template.csv','\uFEFFSchool Code,School Name,Address,Type\r\n','text/csv;charset=utf-8');return null;
    } else if (action==='accounts-export') {
      requireRight('accounts'); download('WAEC_Chart_of_Accounts.json',JSON.stringify({format:'WAEC-COA-1',accounts:state.accounts},null,2),'application/json');return null;
    } else if (action==='account-delete') {
      requireRight('accounts'); requireRight('admin'); need(page==='accounts','Open Chart of accounts first.');
      const a=account(value); need(a,'Account not found.');
      need(!state.entries.some(e=>e.lines.some(l=>l.code===value)),'Account has voucher history and cannot be deleted.');
      const pass=await deletionPassword(); if(pass===null)return null; const user=current(); need(await hash(pass,user.salt)===user.hash,'Invalid administrator password.');
      if(!await confirmDeletion('Permanently delete account '+a.code+' · '+a.name+'?'))return null;
      await change('Account deleted',value,next=>{next.accounts=next.accounts.filter(x=>x.code!==value);});
      if(editAccount===value)editAccount=''; return 'Account deleted.';
    } else if (action==='account-edit') {
      requireRight('accounts'); need(page==='accounts','Open Chart of accounts first.'); need(!value||account(value),'Account not found.'); editAccount=value;
    } else if (action==='school-edit') {
      requireRight('schools');editSchool=value;
    } else if (action==='school-delete') {
      requireRight('schools');requireRight('admin'); const pass=await deletionPassword(); if(pass===null)return null; const user=current(); need(await hash(pass,user.salt)===user.hash,'Invalid administrator password.'); if(!await confirmDeletion('Delete school '+value+'?'))return null;
      need(!state.entries.some(e=>e.school===value),'School has voucher history and cannot be deleted.');await change('School deleted',value,next=>{next.schools=next.schools.filter(s=>s.code!==value);});editSchool='';return 'School deleted.';
    } else if (action==='edit-user') {
      requireRight('admin');
      editUser=value;
    } else if (action==='receipt') {
      requireRight('ledger');
      const e = selected();
      need(e && e.id===Number(value) && cashReceipt(e),'No cash receipt is available.');
      printReceipt(e);
      return null;
    } else if (action==='print' || action==='csv') {
      requireRight('reports');
      if (action==='print') window.print();
      else csv(Number(value));
      return null;
    } else if (action==='backup') {
      requireRight('admin');
      download('WAEC-Finance-Backup-'+today()+'.json',JSON.stringify(state),'application/json');
      return null;
    }
    return '';
  });
});
(async()=>{
  try {
    need(globalThis.crypto?.subtle && globalThis.indexedDB,'Open this file in a current browser that supports IndexedDB and Web Crypto.');
    db=await openDB();
    state=await read();
    render();
  } catch (error) {
    $('view').textContent='';
    notice(error.message || 'The browser could not open IndexedDB.',true);
  }
})();
</script>
</body>
</html>
